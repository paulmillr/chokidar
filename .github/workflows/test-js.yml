name: Run TS tests

on:
  - push
  - pull_request

permissions:
  contents: read

concurrency:
  group: cross-platform-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os.name }} / Node ${{ matrix.node }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
        node:
          - '22'
          - '24'
          - '26'
    runs-on: ${{ matrix.os.runner }}
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Record guest details
        shell: bash
        run: |
          node --version
          npm --version
          node -e "console.log(process.platform, process.arch)"
      - name: Install exact dependencies
        run: npm ci
      - name: Build from TypeScript sources
        run: npm run build
      - name: Verify publishable runtime modules
        run: npm pack --dry-run
      - name: Run watcher tests
        run: npm test
      - name: Run backend parity benchmark smoke test
        if: matrix.node != '26'
        env:
          CHOKIDAR_BENCH_SHAPES: balanced,wide,deep
          CHOKIDAR_BENCH_SCENARIOS: baseline,ignored-depth
          CHOKIDAR_BENCH_ROUNDS: 1
          CHOKIDAR_BENCH_FILES_PER_DIR: 10
          CHOKIDAR_BENCH_LATENCY_SAMPLES: 3
          CHOKIDAR_BENCH_BURST_FILES: 5
        run: npm run benchmark -- 20
